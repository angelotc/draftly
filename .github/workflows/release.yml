# On pushes to main (except README-only changes): test, build and publish the "latest" release.
# Also builds a Velopack installer + update feed, published as release v0.1.<run_number>.
# Downloads (stable URLs, from the "latest" release):
#   https://github.com/angelotc/draftly/releases/latest/download/Draftly-win-Setup.exe  (installer, auto-updates)
#   https://github.com/angelotc/draftly/releases/latest/download/Draftly.zip           (portable, no auto-update)
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false  # don't kill a run halfway through publishing

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Draftly | Out-Null
          Copy-Item target/release/draftly.exe dist/Draftly/Draftly.exe
          Copy-Item config.toml dist/Draftly/config.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Package (Velopack)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          # previous full release, used to build delta packages (no-op if none exists yet)
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" || true
          vpk pack --packId Draftly --packVersion "$VERSION" --packTitle "Draftly" \
            --packDir dist/Draftly --mainExe Draftly.exe --icon assets/icon.ico
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Draftly -DestinationPath Draftly.zip
      - name: Publish update feed (Velopack release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$GH_TOKEN" \
            --publish --releaseName "Draftly $VERSION" --tag "v$VERSION" \
            --targetCommitish "$GITHUB_SHA"
      - name: Publish latest (portable zip + installer)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Draftly.zip Releases/Draftly-win-Setup.exe --target "$GITHUB_SHA" --latest \
            --title "Draftly (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s). Install with Draftly-win-Setup.exe (auto-updates), or unzip Draftly.zip and run Draftly.exe (portable)."
